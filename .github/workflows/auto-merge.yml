name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    uses: tonyputi/.github/.github/workflows/auto-merge.yml@a7aa478ba4fc6b682b8c09b77676cfc80ebb43cf
    with:
      github_app_id: ${{ vars.GH_APP_ID }}
    secrets:
      github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
